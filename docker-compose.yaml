
services:
  app:
    build: .
    container_name: pixelmaniav1
    ports:
      - "80:8081"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8081
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: pixelmaniav1-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
volumes:
  redis-data: